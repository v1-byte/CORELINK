name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.5.1)'
        required: true
        default: 'v1.7.2'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK command-line tools
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip
          mv cmdline-tools latest
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          echo "$HOME/android-sdk/build-tools/35.0.0" >> $GITHUB_PATH

      - name: Accept licenses & install SDK packages
        run: |
          yes | sdkmanager --sdk_root=$HOME/android-sdk --licenses >/dev/null 2>&1 || true
          sdkmanager --sdk_root=$HOME/android-sdk "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Write local.properties
        run: echo "sdk.dir=$HOME/android-sdk" > android/local.properties

      - name: Create signing keystore
        working-directory: android/app
        run: |
          keytool -genkeypair -v \
            -keystore corelink-release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias corelink \
            -storepass corelink123 \
            -keypass corelink123 \
            -dname "CN=CORELINK, OU=Mobile, O=v1-byte, L=ID, ST=ID, C=ID"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Release APK (signed)
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Locate & verify signed APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk -name "*release*.apk" | head -1)
          echo "APK found: $APK"
          ls -lh "$APK"
          # Ensure signed — if still unsigned, sign with apksigner
          if $HOME/android-sdk/build-tools/35.0.0/apksigner verify "$APK" 2>/dev/null; then
            echo "Already signed"
            cp "$APK" CORELINK-signed.apk
          else
            echo "Signing with apksigner..."
            $HOME/android-sdk/build-tools/35.0.0/zipalign -f -p 4 "$APK" CORELINK-aligned.apk
            $HOME/android-sdk/build-tools/35.0.0/apksigner sign \
              --ks android/app/corelink-release.jks \
              --ks-pass pass:corelink123 \
              --key-pass pass:corelink123 \
              --out CORELINK-signed.apk \
              CORELINK-aligned.apk
            $HOME/android-sdk/build-tools/35.0.0/apksigner verify CORELINK-signed.apk
          fi
          cp CORELINK-signed.apk CORELINK-1.7.2.apk
          ls -lh CORELINK-1.7.2.apk
          echo "path=CORELINK-1.7.2.apk" >> $GITHUB_OUTPUT

      - name: Version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: CORELINK ${{ steps.ver.outputs.tag }}
          body: |
            ## CORELINK Android ${{ steps.ver.outputs.tag }}

            **APK ini sudah di-sign** — bisa diinstall di Android.

            ### Install
            1. Download **CORELINK-1.7.2.apk**
            2. Settings → izinkan install dari browser/file manager
            3. Buka file APK → Install
            4. Jika sudah terpasang versi lama: uninstall dulu **atau** izinkan update

            ### Fitur
            - Navbar: CHAT · LINK · TOOLS · SETUP · AI · REMOTE
            - Chat bubble + animasi
            - AI settings (system prompt / temperature)
            - MyBase + A-Connect (UI)

            > Jika install gagal: uninstall APK lama dulu, lalu install ulang.
          files: CORELINK-1.7.2.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
