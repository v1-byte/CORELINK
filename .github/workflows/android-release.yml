name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.3.0)'
        required: false
        default: 'v1.3.0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install build-tools & platform
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Setup Gradle Wrapper
        working-directory: android
        run: |
          mkdir -p gradle/wrapper
          # Download official gradle-wrapper.jar
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
            https://github.com/gradle/gradle/raw/v8.9.0/gradle/wrapper/gradle-wrapper.jar

          cat > gradle/wrapper/gradle-wrapper.properties << 'PROP'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
PROP

          cat > gradlew << 'SCRIPT'
#!/bin/sh
DIR="$(cd "$(dirname "$0")" && pwd)"
exec java -classpath "$DIR/gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"
SCRIPT
          chmod +x gradlew

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "No APK found!"
            find android/app/build -type f | head -30
            exit 1
          fi
          echo "path=$APK" >> $GITHUB_OUTPUT
          ls -lh "$APK"
          # Copy with friendly name
          cp "$APK" CORELINK-1.3.0.apk
          echo "friendly=CORELINK-1.3.0.apk" >> $GITHUB_OUTPUT

      - name: Version tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: CORELINK ${{ steps.ver.outputs.tag }}
          body: |
            ## CORELINK Android ${{ steps.ver.outputs.tag }}

            ### Yang baru
            - Chat UI profesional (bubble user kanan / AI kiri)
            - Composer fixed di bawah + tombol **+** & panah kecil
            - Status **Thinking...** dengan animasi titik
            - Navbar **CHAT · BRIDGE · TOOLS · SETUP** (panel terpisah)
            - Keyboard tidak menutupi composer
            - Auto-scroll pesan baru

            ### Cara install
            1. Download file APK di bawah
            2. Di HP: Settings → izinkan install dari sumber tidak dikenal
            3. Buka file APK → Install
            4. Buka aplikasi → tab **BRIDGE** → Connect

            > APK di-sign dengan debug keystore (siap install langsung).
          files: |
            ${{ steps.apk.outputs.path }}
            CORELINK-1.3.0.apk
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
