name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.3.0)'
        required: true
        default: 'v1.3.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Write local.properties
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > android/local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "APK found: $APK"
          ls -lh "$APK"
          cp "$APK" CORELINK-1.3.0.apk
          echo "path=$APK" >> $GITHUB_OUTPUT

      - name: Version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: CORELINK ${{ steps.ver.outputs.tag }}
          body: |
            ## CORELINK Android ${{ steps.ver.outputs.tag }}

            ### Fitur
            - Chat UI profesional (bubble user kanan / AI kiri)
            - Composer fixed + tombol **+** & panah kecil
            - Status **Thinking...** animasi titik
            - Navbar **CHAT · BRIDGE · TOOLS · SETUP**
            - Keyboard-safe + auto-scroll

            ### Install
            1. Download APK di bawah
            2. Izinkan install dari sumber tidak dikenal
            3. Install & buka aplikasi
            4. Tab **BRIDGE** → Connect
          files: |
            ${{ steps.apk.outputs.path }}
            CORELINK-1.3.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
